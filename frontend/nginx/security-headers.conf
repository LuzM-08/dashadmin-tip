# Se incluye en cada location que define sus propias cabeceras (nginx no hereda add_header entre niveles).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# blob: es necesario para la vista previa de PDF e imágenes (se abren desde un Blob descargado con el token).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; object-src 'self' blob:; frame-src 'self' blob:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Si el sitio se publica con HTTPS, activar también:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
