# Protocolo original: si hay otro proxy/balanceador con HTTPS delante, se respeta lo que informa.
map $http_x_forwarded_proto $proto_original {
  default $scheme;
  https   https;
}

server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Debe ser mayor que MAX_UPLOAD_MB del backend (15 MB por defecto).
  client_max_body_size 16m;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Resolución dinámica del backend: no falla si arranca después y sigue funcionando si se reinicia con otra IP.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # API: se reenvía al backend conservando la ruta (/api/...). Las cabeceras de seguridad las agrega el propio backend.
  location /api/ {
    set $api_upstream http://app-node:4000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proto_original;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # Archivos con hash en el nombre: se pueden cachear un año. Si no existe, 404 (nunca index.html).
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # SPA: cualquier otra ruta devuelve index.html para que el router de React la resuelva
  # (así funcionan los enlaces de los correos, p. ej. /tareas, y recargar la página).
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
  }
}
