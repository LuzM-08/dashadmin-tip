# Producción: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
name: dashboard-ap-prod

services:
  postgres:
    image: postgres:15-alpine
    container_name: ap_prod_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [interna]
    # Sin "ports": la base de datos NO se expone fuera de la red interna de Docker.

  app-node:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: ap_prod_api
    restart: unless-stopped
    env_file: .env.prod
    environment:
      NODE_ENV: production
      PORT: "4000"
      TZ: ${SCHEDULER_TZ:-America/Santiago}
      TRUST_PROXY: "1"
      UPLOADS_DIR: /app/uploads
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks: [interna]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_MODO_PRUEBAS: "false"
    container_name: ap_prod_web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      app-node:
        condition: service_healthy
    networks: [interna]

volumes:
  pgdata:
    name: ap_prod_pgdata
  uploads:
    name: ap_prod_uploads

networks:
  interna: {}
